<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тестовый чат</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0e1319;color:#e6edf3;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .header{background:#161d26;border-bottom:1px solid #232c38;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .header h1{font-size:16px;font-weight:600}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#7b8a9c;margin-left:auto}
  .status .dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;transition:background .3s}
  .status.online .dot{background:#10b981}
  .status.online{color:#10b981}
  .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
  .msg{background:#161d26;border:1px solid #232c38;border-radius:12px;padding:10px 14px;max-width:85%;align-self:flex-start;animation:fadeIn .2s ease}
  .msg.self{background:#3b82f6;border-color:#3b82f6;color:#fff;align-self:flex-end}
  .msg .author{font-size:11px;font-weight:700;opacity:0.7;margin-bottom:4px}
  .msg .content{font-size:14px;line-height:1.5;word-break:break-word}
  .msg .time{font-size:10px;opacity:0.5;margin-top:4px;text-align:right}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .input-bar{background:#161d26;border-top:1px solid #232c38;padding:12px 16px;display:flex;gap:10px;flex-shrink:0}
  .input-bar input{flex:1;padding:12px 16px;background:#0e1319;border:1px solid #232c38;border-radius:12px;color:#e6edf3;font-size:15px;font-family:inherit;outline:none}
  .input-bar input:focus{border-color:#3b82f6}
  .input-bar button{padding:12px 22px;background:#3b82f6;border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .input-bar button:disabled{opacity:0.5;cursor:not-allowed}
  .empty{text-align:center;color:#7b8a9c;padding:40px 20px;font-size:14px}
</style>
</head>
<body>

<div class="header">
  <h1>💬 Тестовый чат</h1>
  <div class="status" id="status">
    <span class="dot"></span>
    <span id="statusText">Подключение…</span>
  </div>
</div>

<div class="messages" id="messages">
  <div class="empty">Пока сообщений нет. Напиши первое!</div>
</div>

<div class="input-bar">
  <input type="text" id="msgInput" placeholder="Напиши сообщение…" autocomplete="off">
  <button id="sendBtn" disabled>Отправить</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'http://supabasekong-uyokcwdou91yzya88he39yzs.111.88.150.142.sslip.io';
  const SUPABASE_KEY = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc4OTg4NTg2MCwiZXhwIjo0OTQ1NTU5NDYwLCJyb2xlIjoiYW5vbiJ9.HfK0ltCNy4SVVfrXaluc32c2dOonGe9JinSpxHsZXBM';
  const MY_AUTHOR = 'Гость-' + Math.floor(Math.random() * 9000 + 1000);
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  const statusTextEl = document.getElementById('statusText');

  async function loadMessages() {
    const { data, error } = await supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(200);
    if (error) { messagesEl.innerHTML = '<div class="empty">Ошибка: ' + error.message + '</div>'; return; }
    messagesEl.innerHTML = '';
    if (!data || !data.length) { messagesEl.innerHTML = '<div class="empty">Пока сообщений нет. Напиши первое!</div>'; return; }
    data.forEach(renderMessage);
    scrollToBottom();
  }

  function renderMessage(msg) {
    const empty = messagesEl.querySelector('.empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg' + (msg.author === MY_AUTHOR ? ' self' : '');
    const t = new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = '<div class="author">' + escapeHtml(msg.author || 'Гость') + '</div>' +
      '<div class="content">' + escapeHtml(msg.content) + '</div>' +
      '<div class="time">' + t + '</div>';
    messagesEl.appendChild(div);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    sendBtn.disabled = true; inputEl.disabled = true;
    const { error } = await supabase.from('messages').insert({ content: text, author: MY_AUTHOR });
    inputEl.disabled = false; sendBtn.disabled = false;
    if (error) { alert('Ошибка: ' + error.message); return; }
    inputEl.value = ''; inputEl.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  function subscribeRealtime() {
    supabase.channel('messages-realtime')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        renderMessage(payload.new); scrollToBottom();
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          statusEl.classList.add('online');
          statusTextEl.textContent = 'В сети · ' + MY_AUTHOR;
          sendBtn.disabled = false;
        } else {
          statusEl.classList.remove('online');
          statusTextEl.textContent = 'Reconnect… (' + status + ')';
        }
      });
  }

  loadMessages();
  subscribeRealtime();
</script>
</body>
</html>
